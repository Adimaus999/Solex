<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // Initialize the map with a default view
        var map = L.map('map').setView([51.5074, -0.1278], 13); // Default to London

        // Add the tile layer (map background)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Add a marker at the default location
        var marker = L.marker([51.5074, -0.1278]).addTo(map);

        // Function to update the map location and move the marker
        function updateMap(lat, lon) {
            map.setView([lat, lon], 13); // Move the map view
            marker.setLatLng([lat, lon]); // Move the marker
        }
    </script>
</body>
</html>
